  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(IV)},key,b(CT));
  if(document.getElementById('rem').checked)localStorage.setItem('hrpuls_pm_pw',pw);
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
 }catch(e){
  btn.disabled=false;
  if(!silent){err.textContent='Невірний пароль';}
  localStorage.removeItem('hrpuls_pm_pw');
 }
}
document.getElementById('go').onclick=()=>tryOpen(document.getElementById('pw').value,false);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryOpen(e.target.value,false)});
const saved=localStorage.getItem('hrpuls_pm_pw');
if(saved)tryOpen(saved,true);
</script></body></html>
