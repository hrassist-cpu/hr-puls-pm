async function tryOpen(pw,silent){
 const btn=document.getElementById('go'),err=document.getElementById('err');
 btn.disabled=true; if(!silent)err.textContent='';
 try{
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(SALT),iterations:ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(IV)},key,b(CT));
  if(document.getElementById('rem').checked)localStorage.setItem('hrpuls_pm_pw',pw);
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
 }catch(e){
  btn.disabled=false;
  if(!silent){err.textContent='Невірний пароль';}
  localStorage.removeItem('hrpuls_pm_pw');
 }
}
